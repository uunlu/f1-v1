name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: f1_season_champions
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug Directory Structure
        run: |
          echo "Current directory:"
          pwd
          echo "Repository root contents:"
          ls -la
          echo "Backend directory contents:"
          ls -la backend
          echo "Find pom.xml:"
          find . -name pom.xml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Maven Installation
        run: mvn --version

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: \${{ runner.os }}-maven-\${{ hashFiles('backend/pom.xml') }}
          restore-keys: \${{ runner.os }}-maven-

      - name: Check code format with Spotless
        run: mvn -B -ntp spotless:check
        working-directory: ./backend

      - name: Build with Maven (skip tests)
        run: mvn -B -ntp verify -DskipTests
        working-directory: ./backend

      - name: Run Tests with Coverage
        run: mvn -B -ntp verify -Dspring.profiles.active=test
        working-directory: ./backend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Detect Image Tag
        id: image-version
        shell: bash
        run: |
          # Default tag in case nothing else works
          DOCKER_IMAGE_TAG="latest"

          if [ "\$GITHUB_REF_TYPE" = "tag" ]; then
            DOCKER_IMAGE_TAG="\${GITHUB_REF_NAME#v}"
          elif [ -n "\$GITHUB_SHA" ]; then
            DOCKER_IMAGE_TAG="\${GITHUB_SHA::7}"
          fi

          # Make sure tag is not empty and valid
          if [ -z "\$DOCKER_IMAGE_TAG" ] || [ "\$DOCKER_IMAGE_TAG" = " " ]; then
            DOCKER_IMAGE_TAG="latest"
          fi

          echo "DOCKER_IMAGE_TAG=\$DOCKER_IMAGE_TAG" >> \$GITHUB_OUTPUT
          # Also set as environment variable
          echo "DOCKER_IMAGE_TAG=\$DOCKER_IMAGE_TAG" >> \$GITHUB_ENV
          # Print for debugging
          echo "Set image tag to: \$DOCKER_IMAGE_TAG"

      - name: Build and push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ugurunlu/f1-app-v1:latest

      # Verify the image exists before scanning
      - name: Verify Docker Image Exists
        run: |
          echo "Waiting for image to be available..."
          docker pull ugurunlu/f1-app-v1:latest

      # Fix the image-ref to use the correct Docker Hub repository
      - name: Run Container Security Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ugurunlu/f1-app-v1:latest
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
