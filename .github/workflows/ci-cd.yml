name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: f1_season_champions
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug Directory Structure
        run: |
          echo "Current directory:"
          pwd
          echo "Repository root contents:"
          ls -la
          echo "Backend directory contents:"
          ls -la backend
          echo "Find pom.xml:"
          find . -name pom.xml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify Maven Installation
        run: mvn --version

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Check code format with Spotless
        run: mvn -B -ntp spotless:check
        working-directory: ./backend

      - name: Build with Maven (skip tests)
        run: mvn -B -ntp verify -DskipTests
        working-directory: ./backend

      - name: Run Tests with Coverage
        run: mvn -B -ntp clean verify -Dspring.profiles.active=test
        working-directory: ./backend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Branch-specific Docker Tags
        id: docker-tags
        run: |
          # Get the current branch name
          BRANCH_NAME=${GITHUB_REF#refs/heads/}

          # Get commit SHA for tagging
          SHORT_SHA=${GITHUB_SHA::7}

          # Generate timestamp for unique tagging
          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          # Set different tags based on branch
          if [ "$BRANCH_NAME" = "main" ]; then
            # For main branch: stable, main-sha
            echo "DOCKER_TAGS=ugurunlu/f1-app-v1:stable,ugurunlu/f1-app-v1:main-${SHORT_SHA}" >> $GITHUB_ENV
            echo "IMAGE_FOR_SCAN=ugurunlu/f1-app-v1:stable" >> $GITHUB_ENV
          elif [ "$BRANCH_NAME" = "develop" ]; then
            # For develop branch: latest, dev-sha
            echo "DOCKER_TAGS=ugurunlu/f1-app-v1:latest,ugurunlu/f1-app-v1:dev-${SHORT_SHA}" >> $GITHUB_ENV
            echo "IMAGE_FOR_SCAN=ugurunlu/f1-app-v1:latest" >> $GITHUB_ENV
          else
            # For other branches/PRs: branch-name-timestamp
            # Replace slashes and other invalid characters in branch name
            SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | tr '/' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9-]/-/g')
            echo "DOCKER_TAGS=ugurunlu/f1-app-v1:${SAFE_BRANCH_NAME}-${SHORT_SHA}" >> $GITHUB_ENV
            echo "IMAGE_FOR_SCAN=ugurunlu/f1-app-v1:${SAFE_BRANCH_NAME}-${SHORT_SHA}" >> $GITHUB_ENV
          fi

          # Debug output
          echo "Branch: $BRANCH_NAME"
          echo "Tags: $DOCKER_TAGS"

      - name: Build and push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ env.DOCKER_TAGS }}

      # Verify the image exists before scanning
      - name: Verify Docker Image Exists
        run: |
          echo "Waiting for image to be available..."
          docker pull ${{ env.IMAGE_FOR_SCAN }}

      # Run security scan on the appropriate tagged image
      - name: Run Container Security Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_FOR_SCAN }}
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
