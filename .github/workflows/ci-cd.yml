name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/catthehacker/ubuntu:act-latest  # Added to match local 'act' environment

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: f1_season_champions
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Maven
        run: |
          apt-get update
          apt-get install -y maven
        # Required for 'act' container, which lacks Maven by default

      - name: Verify Maven Installation
        run: mvn --version
        # Optional: Helps debug Maven setup issues

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Check code format with Spotless
        run: mvn -f backend/pom.xml spotless:check

      - name: Build with Maven (skip tests)
        run: mvn -B verify -DskipTests

      - name: Run Unit Tests with Coverage
        run: |
          mvn test -Djacoco.skip=false
          mvn jacoco:report

      - name: Check Code Coverage (fail if < 70%)
        run: |
          coverage_line=$(grep -oPm1 '(?<=<line-rate>)[^<]+' target/site/jacoco/jacoco.xml)
          coverage=$(awk "BEGIN {print ($coverage_line * 100)}")
          echo "Coverage: $coverage%"
          if (( $(echo "$coverage < 70" | bc -l) )); then
            echo "Error: Code coverage ($coverage%) is below 70%"
            exit 1
          fi

      - name: Run Integration Tests
        run: mvn verify -Dspring.profiles.active=test

      - name: Build Docker Image
        run: mvn spring-boot:build-image
        env:
          DOCKER_REGISTRY: docker.io
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image
        run: mvn dockerfile:push
        env:
          DOCKER_REGISTRY: docker.io
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Run Container Security Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ github.repository }}:latest
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
