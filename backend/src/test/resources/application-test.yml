spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: sa
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 2
      minimum-idle: 1
      max-lifetime: 10000
      connection-timeout: 5000
      idle-timeout: 30000
      leak-detection-threshold: 60000
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false

logging:
  level:
    com.f1.seasonchampions: DEBUG
    org.hibernate.SQL: DEBUG
    com.zaxxer.hikari: WARN

f1:
  seasonchampions:
    startup:
      seeding:
        enabled: false 